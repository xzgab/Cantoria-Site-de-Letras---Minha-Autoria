<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Música — Cantoria</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>" />
</head>

<body data-page="musica">
  <header id="site-header"></header>

  <main class="container" id="music-main">
    <div id="music-loading" class="loading-state">
      <div class="spinner"></div>
      <p>Carregando letra...</p>
    </div>
    <div id="music-content" hidden></div>
    <div id="music-notfound" class="empty-state" hidden>
      <div class="empty-icon">🎵</div>
      <h3>Música não encontrada</h3>
      <p>Esta letra pode ter sido removida ou o link está incorreto.</p>
      <a class="btn btn-primary" href="letras.html">Voltar ao catálogo</a>
    </div>
  </main>

  <div id="player-bar" class="player-bar" aria-hidden="true"></div>
  <div id="toast-container" class="toast-container"></div>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/player.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/musica.js"></script>
</body>

</html>
